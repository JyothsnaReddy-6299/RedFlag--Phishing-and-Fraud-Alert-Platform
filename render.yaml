services:
  - type: web
    name: redflag-platform
    env: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: "RedFlag Threat Intelligence Platform"
      # SQLite is fine for the demo. For persistence across deploys, attach a
      # managed Postgres and set REDFLAG_DATABASE_URL instead.
      - key: REDFLAG_DATABASE_URL
        value: "sqlite:///./redflag.db"
      - key: REDFLAG_RATE_ANALYZE
        value: "30"
      - key: REDFLAG_RATE_REPORT
        value: "10"
